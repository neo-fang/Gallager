<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">CtrlX tmux continuity and end-to-end encrypted relay architecture</title>
  <desc id="desc">A persistent tmux workspace on each Host Mac runs agents and terminals without interruption. Local terminals attach directly, while Mac and iPhone viewers reconnect through an end-to-end encrypted relay that routes ciphertext only.</desc>

  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0E13"/>
      <stop offset="0.55" stop-color="#10151C"/>
      <stop offset="1" stop-color="#0A0D12"/>
    </linearGradient>
    <linearGradient id="hostPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#181E27"/>
      <stop offset="1" stop-color="#12171E"/>
    </linearGradient>
    <linearGradient id="tmuxPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151E23"/>
      <stop offset="1" stop-color="#10161B"/>
    </linearGradient>
    <linearGradient id="relayPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17232C"/>
      <stop offset="1" stop-color="#101820"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#FFFFFF" stroke-opacity="0.025" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#62D8FF"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#61E294"/>
    </marker>
  </defs>

  <rect width="1600" height="900" rx="32" fill="url(#canvas)"/>
  <rect width="1600" height="900" rx="32" fill="url(#grid)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="72" y="62" fill="#62D8FF" font-size="15" font-weight="700" letter-spacing="3.6">CTRLX ARCHITECTURE</text>
    <text x="72" y="118" fill="#F5F7FA" font-size="42" font-weight="760">tmux stays. You move.</text>
    <text x="72" y="154" fill="#9EABB9" font-size="19">Persistent sessions · native reuse · agents run unchanged · E2EE across devices</text>

    <!-- Stacked cards imply many independent Host Macs. -->
    <rect x="52" y="208" width="770" height="554" rx="28" fill="#0E1218" stroke="#34404D" stroke-width="1.5"/>
    <rect x="61" y="199" width="770" height="554" rx="28" fill="#11161D" stroke="#3B4754" stroke-width="1.5"/>
    <rect x="72" y="188" width="770" height="554" rx="28" fill="url(#hostPanel)" stroke="#556271" stroke-width="1.5"/>

    <circle cx="106" cy="226" r="7" fill="#61E294" filter="url(#softGlow)"/>
    <text x="126" y="232" fill="#F2F5F8" font-size="18" font-weight="700">HOST MAC</text>
    <text x="235" y="232" fill="#8E9BA9" font-size="16">one of many</text>
    <rect x="670" y="207" width="136" height="36" rx="18" fill="#202832" stroke="#3D4A58"/>
    <text x="738" y="231" text-anchor="middle" fill="#BAC4CE" font-size="14" font-weight="650">+ MORE HOSTS</text>

    <!-- tmux is the source of truth and owns the long-running sessions. -->
    <rect x="108" y="267" width="698" height="286" rx="22" fill="url(#tmuxPanel)" stroke="#4C6870" stroke-width="1.5"/>
    <rect x="108" y="267" width="7" height="286" rx="3.5" fill="#61E294"/>
    <text x="140" y="310" fill="#61E294" font-size="24" font-weight="780">tmux</text>
    <text x="205" y="310" fill="#F3F6F8" font-size="22" font-weight="680">persistent workspace</text>
    <text x="140" y="338" fill="#91A0AE" font-size="15">SOURCE OF TRUTH · SESSION / WINDOW / PANE</text>

    <g>
      <rect x="140" y="365" width="194" height="125" rx="16" fill="#101820" stroke="#315F70"/>
      <circle cx="168" cy="394" r="12" fill="#62D8FF" fill-opacity="0.16" stroke="#62D8FF"/>
      <path d="M 162 390 L 168 395 L 162 400 M 172 400 H 178" fill="none" stroke="#62D8FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="192" y="400" fill="#EAF6FA" font-size="18" font-weight="700">Codex</text>
      <text x="160" y="434" fill="#A8B4BF" font-size="15">Agent TUI</text>
      <text x="160" y="461" fill="#6F8190" font-size="14">runs unchanged</text>
    </g>

    <g>
      <rect x="357" y="365" width="194" height="125" rx="16" fill="#15151F" stroke="#54477C"/>
      <circle cx="385" cy="394" r="12" fill="#A78BFA" fill-opacity="0.16" stroke="#A78BFA"/>
      <path d="M 379 394 H 391 M 385 388 V 400" fill="none" stroke="#A78BFA" stroke-width="2" stroke-linecap="round"/>
      <text x="409" y="400" fill="#F0ECFF" font-size="18" font-weight="700">Claude Code</text>
      <text x="377" y="434" fill="#A8B4BF" font-size="15">Agent TUI</text>
      <text x="377" y="461" fill="#6F8190" font-size="14">runs unchanged</text>
    </g>

    <g>
      <rect x="574" y="365" width="194" height="125" rx="16" fill="#1A1812" stroke="#6D5B31"/>
      <circle cx="602" cy="394" r="12" fill="#F6C85F" fill-opacity="0.16" stroke="#F6C85F"/>
      <path d="M 596 390 L 602 395 L 596 400 M 606 400 H 612" fill="none" stroke="#F6C85F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="626" y="400" fill="#FFF7E2" font-size="18" font-weight="700">Any TUI</text>
      <text x="594" y="434" fill="#A8B4BF" font-size="15">Shell · tools</text>
      <text x="594" y="461" fill="#6F8190" font-size="14">no wrapper required</text>
    </g>

    <rect x="140" y="510" width="628" height="26" rx="13" fill="#182129"/>
    <circle cx="160" cy="523" r="4" fill="#61E294"/>
    <text x="176" y="528" fill="#8FA0AD" font-size="13" font-family="SFMono-Regular, Menlo, monospace">session: coding  ·  window: 3  ·  pane: 7  ·  alive</text>

    <!-- Continuity: CtrlX can disappear; tmux remains alive. -->
    <rect x="108" y="574" width="698" height="100" rx="20" fill="#111820" stroke="#344651"/>
    <text x="138" y="605" fill="#F2F5F8" font-size="17" font-weight="700">CONTINUITY</text>
    <text x="138" y="633" fill="#81909E" font-size="14">CtrlX reconnects. tmux never stops.</text>
    <text x="350" y="600" fill="#98A6B3" font-size="13">App closes</text>
    <text x="466" y="600" fill="#98A6B3" font-size="13">Network drops</text>
    <text x="586" y="600" fill="#98A6B3" font-size="13">Viewer changes</text>
    <path d="M 349 640 C 395 608, 468 608, 512 640 C 552 670, 623 670, 665 640" fill="none" stroke="#61E294" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowGreen)"/>
    <circle cx="372" cy="626" r="5" fill="#61E294"/>
    <circle cx="510" cy="639" r="5" fill="#61E294"/>
    <circle cx="640" cy="652" r="5" fill="#61E294"/>
    <rect x="668" y="620" width="112" height="42" rx="21" fill="#173127" stroke="#3E9B6B"/>
    <text x="724" y="647" text-anchor="middle" fill="#76E8A5" font-size="14" font-weight="750">STILL RUNNING</text>

    <!-- Native local reuse. -->
    <rect x="108" y="695" width="698" height="38" rx="19" fill="#1B222B"/>
    <rect x="126" y="706" width="18" height="14" rx="2" fill="none" stroke="#B7C1CB" stroke-width="1.5"/>
    <path d="M 130 711 L 134 714 L 130 717 M 137 717 H 141" fill="none" stroke="#B7C1CB" stroke-width="1.4" stroke-linecap="round"/>
    <text x="158" y="720" fill="#C6CFD7" font-size="14" font-weight="650">SYSTEM TERMINAL</text>
    <path d="M 302 714 H 370" stroke="#62D8FF" stroke-width="1.5" stroke-dasharray="4 5" marker-end="url(#arrowCyan)"/>
    <text x="390" y="720" fill="#8E9BA8" font-size="14">attaches to the same tmux session</text>

    <!-- E2EE boundary from Host to Relay. -->
    <line x1="842" y1="438" x2="902" y2="438" stroke="#62D8FF" stroke-width="2.5" marker-start="url(#arrowCyan)" marker-end="url(#arrowCyan)"/>
    <rect x="848" y="394" width="48" height="25" rx="12.5" fill="#112630" stroke="#2F7186"/>
    <path d="M 866 405 V 402 A 6 6 0 0 1 878 402 V 405 M 864 405 H 880 V 414 H 864 Z" fill="none" stroke="#62D8FF" stroke-width="1.5"/>
    <text x="872" y="467" text-anchor="middle" fill="#62D8FF" font-size="13" font-weight="700">E2EE</text>

    <!-- Relay only routes ciphertext. -->
    <rect x="902" y="300" width="260" height="286" rx="28" fill="url(#relayPanel)" stroke="#3B6A7B" stroke-width="1.5"/>
    <circle cx="1032" cy="363" r="36" fill="#132B35" stroke="#62D8FF" stroke-width="1.5" filter="url(#softGlow)"/>
    <path d="M 1018 358 V 349 A 14 14 0 0 1 1046 349 V 358 M 1013 358 H 1051 V 380 H 1013 Z" fill="none" stroke="#62D8FF" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="1032" cy="369" r="3" fill="#62D8FF"/>
    <text x="1032" y="432" text-anchor="middle" fill="#F2F7FA" font-size="20" font-weight="750">E2EE RELAY</text>
    <text x="1032" y="465" text-anchor="middle" fill="#9DAAB7" font-size="15">pairs devices</text>
    <text x="1032" y="490" text-anchor="middle" fill="#9DAAB7" font-size="15">routes ciphertext</text>
    <line x1="950" y1="514" x2="1114" y2="514" stroke="#32424E"/>
    <text x="1032" y="545" text-anchor="middle" fill="#61E294" font-size="14" font-weight="700">NO TERMINAL ACCESS</text>

    <!-- One encrypted path fans out to supported viewers. -->
    <line x1="1162" y1="438" x2="1204" y2="438" stroke="#62D8FF" stroke-width="2.5" marker-start="url(#arrowCyan)" marker-end="url(#arrowCyan)"/>
    <line x1="1204" y1="330" x2="1204" y2="548" stroke="#62D8FF" stroke-width="2"/>
    <line x1="1204" y1="330" x2="1230" y2="330" stroke="#62D8FF" stroke-width="2" marker-end="url(#arrowCyan)"/>
    <line x1="1204" y1="548" x2="1230" y2="548" stroke="#62D8FF" stroke-width="2" marker-end="url(#arrowCyan)"/>

    <rect x="1230" y="244" width="300" height="172" rx="24" fill="#171D25" stroke="#475665" stroke-width="1.5"/>
    <rect x="1261" y="278" width="52" height="38" rx="5" fill="none" stroke="#BFC9D3" stroke-width="2"/>
    <path d="M 1279 324 H 1295 M 1287 316 V 324" stroke="#BFC9D3" stroke-width="2" stroke-linecap="round"/>
    <text x="1335" y="291" fill="#F3F6F8" font-size="19" font-weight="720">CtrlX for Mac</text>
    <text x="1335" y="319" fill="#8E9CAA" font-size="14">Host + Viewer</text>
    <rect x="1261" y="349" width="233" height="38" rx="19" fill="#1C2730"/>
    <text x="1377" y="374" text-anchor="middle" fill="#B9C5CE" font-size="14">view · type · switch Host</text>

    <rect x="1230" y="462" width="300" height="172" rx="24" fill="#171D25" stroke="#475665" stroke-width="1.5"/>
    <rect x="1270" y="492" width="34" height="55" rx="7" fill="none" stroke="#BFC9D3" stroke-width="2"/>
    <line x1="1281" y1="498" x2="1293" y2="498" stroke="#BFC9D3" stroke-width="2" stroke-linecap="round"/>
    <circle cx="1287" cy="540" r="2" fill="#BFC9D3"/>
    <text x="1335" y="509" fill="#F3F6F8" font-size="19" font-weight="720">CtrlX for iPhone</text>
    <text x="1335" y="537" fill="#8E9CAA" font-size="14">Viewer</text>
    <rect x="1261" y="567" width="233" height="38" rx="19" fill="#1C2730"/>
    <text x="1377" y="592" text-anchor="middle" fill="#B9C5CE" font-size="14">view · type · get notified</text>

    <text x="1379" y="674" text-anchor="middle" fill="#62D8FF" font-size="14" font-weight="700">ANY PAIRED HOST</text>
    <text x="1379" y="700" text-anchor="middle" fill="#8493A0" font-size="14">one workspace across screens</text>

    <line x1="72" y1="800" x2="1528" y2="800" stroke="#27323D"/>
    <circle cx="352" cy="838" r="4" fill="#61E294"/>
    <text x="368" y="844" fill="#9BA8B4" font-size="14" font-weight="650">NO PUBLIC IP</text>
    <circle cx="650" cy="838" r="4" fill="#61E294"/>
    <text x="666" y="844" fill="#9BA8B4" font-size="14" font-weight="650">NO INBOUND PORT</text>
    <circle cx="990" cy="838" r="4" fill="#61E294"/>
    <text x="1006" y="844" fill="#9BA8B4" font-size="14" font-weight="650">NO PROPRIETARY SESSION MODEL</text>
  </g>
</svg>
