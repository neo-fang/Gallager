name: Connectivity Test Bundle

on:
  workflow_dispatch:
  push:
    tags:
      - "connectivity-test-*"

permissions:
  contents: write

jobs:
  build-linux-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Build CtrlX Linux runtime image
        run: |
          docker build \
            --file ClaudeSpyPackage/Dockerfile \
            --build-arg CTRLX_VERSION=3.0.0 \
            --build-arg CTRLX_SOURCE_REVISION="$GITHUB_SHA" \
            --build-arg CTRLX_SOURCE_REPOSITORY="https://github.com/${GITHUB_REPOSITORY}" \
            --tag "connectivity-test:$GITHUB_SHA" \
            ClaudeSpyPackage

      - name: Export runtime filesystem
        run: |
          mkdir -p dist
          container_id="$(docker create "connectivity-test:$GITHUB_SHA")"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          docker export "$container_id" | gzip -9 > dist/connectivity-test-rootfs-linux-amd64.tar.gz
          sha256sum dist/connectivity-test-rootfs-linux-amd64.tar.gz \
            > dist/connectivity-test-rootfs-linux-amd64.tar.gz.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: connectivity-test-rootfs-linux-amd64
          path: dist/*
          if-no-files-found: error
          retention-days: 7

      - name: Publish tagged test bundle
        if: startsWith(github.ref, 'refs/tags/connectivity-test-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "Connectivity test $GITHUB_REF_NAME" \
            --notes "Temporary Linux runtime bundle for the demo-v2 connectivity test. Source: $GITHUB_SHA" \
            dist/connectivity-test-rootfs-linux-amd64.tar.gz \
            dist/connectivity-test-rootfs-linux-amd64.tar.gz.sha256
