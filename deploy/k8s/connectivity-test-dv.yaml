apiVersion: v1
kind: Namespace
metadata:
  name: connectivity-test
  labels:
    app.kubernetes.io/part-of: ctrlx
    environment: dv
  annotations:
    app.kubernetes.io/purpose: DV connectivity validation for encrypted device transport
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: connectivity-test-dv-storage
  labels:
    app.kubernetes.io/name: connectivity-test
    app.kubernetes.io/part-of: ctrlx
    environment: dv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  volumeMode: Filesystem
  hostPath:
    path: /var/lib/connectivity-test-dv
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - 10.4.0.3
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: connectivity-test-storage
  namespace: connectivity-test
  labels:
    app.kubernetes.io/name: connectivity-test
    app.kubernetes.io/part-of: ctrlx
    environment: dv
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: connectivity-test-dv-storage
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: connectivity-test-app
  namespace: connectivity-test
  labels:
    app.kubernetes.io/name: connectivity-test
    app.kubernetes.io/part-of: ctrlx
    environment: dv
  annotations:
    app.kubernetes.io/purpose: DV connectivity validation for encrypted device transport
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: connectivity-test
  template:
    metadata:
      labels:
        app.kubernetes.io/name: connectivity-test
        app.kubernetes.io/part-of: ctrlx
        environment: dv
    spec:
      nodeSelector:
        kubernetes.io/hostname: 10.4.0.3
      imagePullSecrets:
        - name: connectivity-test-registry
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-storage
          image: llm4rec-cn-beijing.cr.volces.com/byteair/byteair.nocalhost.golang:1.0.0.5
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -lc
            - mkdir -p /data && chown 1000:1000 /data
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 0
            runAsGroup: 0
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
          volumeMounts:
            - name: app-data
              mountPath: /data
      containers:
        - name: app
          image: llm4rec-cn-beijing.cr.volces.com/byteair/connectivity-test-app:3.0.0-a3b4ffe
          imagePullPolicy: IfNotPresent
          env:
            - name: ENVIRONMENT
              value: production
            - name: LOG_LEVEL
              value: warning
            - name: CTRLX_VERSION
              value: 3.0.0
            - name: CTRLX_SOURCE_REVISION
              value: a3b4ffe63cb44b4f165c3f5773bfaf1dc26e0ffc
            - name: CTRLX_SOURCE_REPOSITORY
              value: https://github.com/neo-fang/Gallager
            - name: CTRLX_PROTOCOL_VERSION
              value: "3.0"
            - name: CTRLX_RELAY_BIND_ADDRESS
              value: 0.0.0.0
            - name: CTRLX_RELAY_PORT
              value: "8080"
            - name: MIN_CLIENT_VERSION
              value: 3.0.0
            - name: PAIRING_CODE_EXPIRY_SECONDS
              value: "300"
            - name: DATA_DIRECTORY
              value: /data
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
              ephemeral-storage: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: app-data
              mountPath: /data
      volumes:
        - name: app-data
          persistentVolumeClaim:
            claimName: connectivity-test-storage
---
apiVersion: v1
kind: Service
metadata:
  name: connectivity-test-service
  namespace: connectivity-test
  labels:
    app.kubernetes.io/name: connectivity-test
    app.kubernetes.io/part-of: ctrlx
    environment: dv
  annotations:
    app.kubernetes.io/purpose: DV connectivity validation for encrypted device transport
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: connectivity-test
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
