apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: connectivity-test-storage
  namespace: demo-v2
  labels:
    app.kubernetes.io/name: connectivity-test
    app.kubernetes.io/part-of: ctrlx
  annotations:
    app.kubernetes.io/purpose: demo connectivity validation for encrypted device transport
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ebs-ssd
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: connectivity-test-app
  namespace: demo-v2
  labels:
    app.kubernetes.io/name: connectivity-test
    app.kubernetes.io/part-of: ctrlx
  annotations:
    app.kubernetes.io/purpose: demo connectivity validation for encrypted device transport
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: connectivity-test
  template:
    metadata:
      labels:
        app.kubernetes.io/name: connectivity-test
        app.kubernetes.io/part-of: ctrlx
    spec:
      imagePullSecrets:
        - name: byteair-cr-secret
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: validate-runtime
          image: llm4rec-cn-beijing.cr.volces.com/byteair/byteair.nocalhost.golang:1.0.0.5
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -lc
            - test -x /bundle/rootfs/app/ClaudeSpyExternalServer
          volumeMounts:
            - name: runtime-and-data
              mountPath: /bundle
      containers:
        - name: app
          image: llm4rec-cn-beijing.cr.volces.com/byteair/byteair.nocalhost.golang:1.0.0.5
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -lc
          args:
            - exec chroot --userspec=appuser:appuser /bundle/rootfs /app/ClaudeSpyExternalServer
          env:
            - name: ENVIRONMENT
              value: production
            - name: LOG_LEVEL
              value: warning
            - name: CTRLX_VERSION
              value: 3.0.0
            - name: CTRLX_SOURCE_REVISION
              value: a3b4ffe63cb44b4f165c3f5773bfaf1dc26e0ffc
            - name: CTRLX_SOURCE_REPOSITORY
              value: https://github.com/neo-fang/Gallager
            - name: CTRLX_PROTOCOL_VERSION
              value: "3.0"
            - name: CTRLX_RELAY_BIND_ADDRESS
              value: 0.0.0.0
            - name: CTRLX_RELAY_PORT
              value: "8080"
            - name: MIN_CLIENT_VERSION
              value: 3.0.0
            - name: PAIRING_CODE_EXPIRY_SECONDS
              value: "300"
            - name: DATA_DIRECTORY
              value: /data
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
              ephemeral-storage: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - SYS_CHROOT
          volumeMounts:
            - name: runtime-and-data
              mountPath: /bundle
      volumes:
        - name: runtime-and-data
          persistentVolumeClaim:
            claimName: connectivity-test-storage
---
apiVersion: v1
kind: Service
metadata:
  name: connectivity-test-service
  namespace: demo-v2
  labels:
    app.kubernetes.io/name: connectivity-test
    app.kubernetes.io/part-of: ctrlx
  annotations:
    app.kubernetes.io/purpose: demo connectivity validation for encrypted device transport
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: connectivity-test
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
